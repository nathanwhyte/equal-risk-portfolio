# Resources split into k8s/ directory
#
# Apply all resources:
#   kubectl apply -f k8s/
#
# Individual files:
#   k8s/namespace.yaml          - Namespace
#   k8s/postgres.yaml           - PostgreSQL StatefulSet + Service
#   k8s/external-postgres.yaml  - Legacy external postgres EndpointSlice
#   k8s/math-api.yaml           - Math API Deployment + Service
#   k8s/rails.yaml              - Rails Deployment + Service
#   k8s/cloudflared.yaml        - Cloudflare tunnel ServiceAccount + Deployment
#   k8s/cloudflared-secret.yaml - Cloudflare tunnel token (gitignored)
#   k8s/rbac.yaml               - Hook rollout restart Role + RoleBinding
