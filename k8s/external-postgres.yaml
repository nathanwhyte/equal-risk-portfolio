---
apiVersion: v1
kind: Service
metadata:
  name: external-postgres
  namespace: equal-risk
spec:
  clusterIP: None
  ports:
    - port: 5555
      targetPort: 5555
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-postgres
  namespace: equal-risk
  labels:
    kubernetes.io/service-name: external-postgres
addressType: IPv4
ports:
  - name: postgres
    port: 5432
endpoints:
  - addresses:
      - 192.168.1.9
