---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: equal-risk-math
  namespace: equal-risk
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: equal-risk-math
  template:
    metadata:
      labels:
        app: equal-risk-math
    spec:
      containers:
        - name: math
          image: registry.nathanwhyte.dev/equal-risk/math:test
          imagePullPolicy: IfNotPresent
          env:
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: POLYGON_API_KEY
            - name: EQUAL_RISK_PORTFOLIO_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE_USERNAME
            - name: EQUAL_RISK_PORTFOLIO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE_PASSWORD
            - name: EQUAL_RISK_PORTFOLIO_DATABASE_HOST
              value: postgres.equal-risk.svc.cluster.local
            - name: EQUAL_RISK_PORTFOLIO_DATABASE_PORT
              value: "5432"
            - name: EQUAL_RISK_PORTFOLIO_DATABASE
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: math
  namespace: equal-risk
spec:
  selector:
    app: equal-risk-math
  ports:
    - port: 3001
      targetPort: 3001
