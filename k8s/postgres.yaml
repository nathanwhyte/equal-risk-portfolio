---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: equal-risk
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # Readiness only. On 2026-10-26 the volume's NFS server (Longhorn
          # share-manager) hung at startup and Postgres stopped accepting
          # connections for 2.5 days while the pod reported 1/1 Ready — there
          # was no probe, so the only alerts were downstream (stale backup,
          # rails init stuck). With this, the pod goes NotReady and the cluster's
          # KubePodNotReady / KubeStatefulSetReplicasMismatch name Postgres itself.
          # No livenessProbe: a process stuck in NFS I/O cannot be killed by a
          # container restart, so liveness would only add a restart loop.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: 10Gi
        storageClassName: longhorn-db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: equal-risk
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
