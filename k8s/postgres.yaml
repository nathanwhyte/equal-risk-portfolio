---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: equal-risk
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: equal-risk-secrets
                  key: EQUAL_RISK_PORTFOLIO_DATABASE
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          # Readiness only. On 2026-10-26 the volume's NFS server (Longhorn
          # share-manager) hung at startup and Postgres stopped accepting
          # connections for 2.5 days while the pod reported 1/1 Ready — there
          # was no probe, so the only alerts were downstream (stale backup,
          # rails init stuck). With this, the pod goes NotReady and the cluster's
          # KubePodNotReady / KubeStatefulSetReplicasMismatch name Postgres itself.
          # No livenessProbe: a process stuck in NFS I/O cannot be killed by a
          # container restart, so liveness would only add a restart loop.
          # -U/-d matter: without them pg_isready connects as the OS user
          # `root`, and Postgres logs `FATAL: role "root" does not exist` on
          # every probe (every 10s). The env vars come from the container env.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  # ReadWriteOnce since 2026-10-28. It was ReadWriteMany, which Longhorn serves
  # over NFS through a share-manager pod; that pod hung on 2026-10-26 and took
  # Postgres down for 2.5 days. One replica needs no shared access. The template
  # was renamed (postgres-data -> pgdata) because the old RWX claim cannot change
  # access mode; see k8s/migrations/2026-10-28-postgres-rwo.yaml. Changing this
  # block requires deleting and re-creating the StatefulSet (immutable field).
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: longhorn-db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: equal-risk
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
